[project]
name = "hermes"
version = "0.1.0"
description = "Multi-agent AI trading system"
requires-python = ">=3.12"
dependencies = [
    # Data & exchange
    "ccxt>=4.3",
    "duckdb>=1.1",
    "pandas>=2.2",
    "numpy>=2.0",
    "arch>=7.0",          # GARCH
    "hurst>=0.0.5",       # Hurst exponent
    # Brain / agents
    "langgraph>=0.2",
    "langchain-core>=0.3",
    "langchain-openai>=0.2",
    # Backend / dashboard
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "jinja2>=3.1",
    "httpx>=0.27",
    # Infra / config
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "python-dotenv>=1.0",
    # Observability
    "structlog>=24.4",
]

[project.optional-dependencies]
cloud = [
    "google-cloud-secret-manager>=2.21",
    "google-cloud-storage>=2.18",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "ruff>=0.7",
    "mypy>=1.13",
    "pip-audit>=2.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "S", "B"]
ignore = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "unit: unit tests (no external deps)",
    "integration: integration tests (Binance testnet required)",
    "e2e: end-to-end pipeline tests (paper mode)",
]
