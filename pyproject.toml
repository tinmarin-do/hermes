[project]
name = "hermes"
version = "0.1.0"
description = "Multi-agent AI trading system"
requires-python = ">=3.12"
dependencies = [
    # Data & exchange
    "ccxt>=4.3",
    "duckdb>=1.1",
    "pandas>=2.2",
    "numpy>=2.0",
    "arch>=7.0",          # GARCH
    "hurst>=0.0.5",       # Hurst exponent
    "scipy>=1.14",        # cópula t-Student (Risk Agent, Sprint 2)
    # Brain / agents
    "langgraph>=0.2",
    "langchain-core>=0.3",
    "langchain-openai>=0.2",
# Backend / dashboard
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "jinja2>=3.1",
    "httpx>=0.27",
    # Infra / config
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "python-dotenv>=1.0",
    # Quant core (§8.7.2) — LightGBM predictor + SHAP explainability
    "lightgbm>=4.0",
    "shap>=0.45",
    # Observability
    "structlog>=24.4",
]

[project.optional-dependencies]
cloud = [
    "google-cloud-secret-manager>=2.21",
    "google-cloud-storage>=2.18",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "ruff>=0.7",
    "mypy>=1.13",
    "pip-audit>=2.7",
]
news = [
    "sentence-transformers>=3.0",   # embeddings de noticias (local, CPU)
    "umap-learn>=0.5.6",           # reducción de dimensión para clusterizar
    "numba>=0.60",                 # forzar wheel compatible con 3.12 (umap dep)
    "llvmlite>=0.43",              # idem — evita resolver al 0.36 sin wheel
    "hdbscan>=0.8.38",             # clustering por densidad + DBCV
    "scikit-learn>=1.5",           # K-Means, Agglomerative, métricas de validez
    "matplotlib>=3.9",             # gráfica 2D (t-SNE) de inspección
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "S", "B"]
ignore = ["S101"]

# Documented, intentional exceptions in pre-existing modules (mostly the data
# pipeline + LLM agents, which entered lint when src/data/ became tracked).
[tool.ruff.lint.per-file-ignores]
"src/brain/agents/*.py" = ["E501"]          # long LLM system-prompt string literals
"src/brain/news_verify.py" = ["E501"]
"src/brain/runner.py" = ["E501"]            # formatted cost/decision print lines
"src/data/bronze/ingest.py" = ["E501"]
"src/data/bronze/news_sources.py" = ["S324", "S314"]  # sha1 = content dedup id (not security); RSS XML from configured feeds
"src/data/gold/aggregate.py" = ["B905"]     # zip over column lists aligned by construction
"src/data/silver/news_transform.py" = ["E501", "S301", "S110", "B905"]  # local model pickle + best-effort parses
"src/data/silver/transform.py" = ["S110"]   # best-effort feature calc, failures are non-fatal
"src/execution/binance.py" = ["S110"]       # best-effort exchange cleanup on kill

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

# Gradual typing: strict stays on for new/core code (execution, cost_meter,
# quant_core, dashboard, runner). Pre-existing, never-typed modules (the data
# pipeline + LLM agents + LangGraph state/graph) are excluded until typed.
[[tool.mypy.overrides]]
module = [
    "src.data.*",
    "src.brain.agents.*",
    "src.brain.state",
    "src.brain.graph",
    "src.brain.news_verify",
    "src.brain.calibrate",
]
ignore_errors = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# Default run EXCLUDES the paid/external suites: e2e invokes the real DeepSeek API
# (~$0.01/run) and integration hits Binance testnet. So a bare `pytest` / `pytest
# tests/` stays free and offline. To run them on purpose, override the marker:
#   uv run pytest -m e2e          (paga LLM — cotizar/gatear antes, regla #6)
#   uv run pytest -m integration  (requiere BINANCE_TESTNET_*)
# CI passes `-m unit` explicitly, so it's unaffected.
addopts = "-m 'not e2e and not integration'"
markers = [
    "unit: unit tests (no external deps)",
    "integration: integration tests (Binance testnet required)",
    "e2e: end-to-end pipeline tests (paper mode)",
]
