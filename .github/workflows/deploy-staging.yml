name: Deploy — Staging (develop → testnet)

on:
  push:
    branches: [develop]

jobs:
  deploy-staging:
    name: Deploy to staging (testnet)
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY_STAGING }}
      - uses: google-github-actions/setup-gcloud@v2

      - name: Build and push dashboard image
        run: |
          gcloud builds submit \
            --tag gcr.io/${{ vars.GCP_PROJECT_ID }}/hermes-dashboard:${{ github.sha }} \
            src/dashboard/

      - name: Deploy dashboard to Cloud Run (staging)
        run: |
          gcloud run deploy hermes-dashboard-staging \
            --image gcr.io/${{ vars.GCP_PROJECT_ID }}/hermes-dashboard:${{ github.sha }} \
            --region ${{ vars.GCP_REGION }} \
            --allow-unauthenticated \
            --set-env-vars HERMES_MODE=cloud,EXCHANGE_MODE=testnet \
            --min-instances 0 --max-instances 1

      - name: Run integration tests against staging
        run: |
          uv run pytest tests/integration/ -m integration \
            --base-url=$(gcloud run services describe hermes-dashboard-staging \
              --region=${{ vars.GCP_REGION }} --format='value(status.url)')
