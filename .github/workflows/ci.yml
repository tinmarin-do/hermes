name: CI — Tests + Cost Check + Security Scan

on:
  push:
    branches: [develop, "feature/**", "hotfix/**"]
  pull_request:
    branches: [develop, main]

jobs:
  test-unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
      - name: Install dependencies
        run: uv sync --extra dev
      - name: Run unit tests
        run: uv run pytest tests/unit/ -v --tb=short -m unit --cov=src --cov-report=xml
      - uses: codecov/codecov-action@v4
        with:
          files: coverage.xml

  cost-check:
    name: Cost Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - name: Install dependencies
        run: uv sync --extra dev
      - name: Verify LLM budget not exceeded
        run: |
          python scripts/cost_check.py \
            --ledger docs/cost_ledger_llm.md \
            --cap 150.0 \
            --fail-at-pct 95
      - name: Verify no secrets in diff
        run: |
          git diff origin/main...HEAD | grep -iE '(api_key|secret|password|token)\s*=\s*[a-zA-Z0-9]' && \
            echo "❌ Posible secreto detectado en diff" && exit 1 || \
            echo "✅ Sin secretos detectados"

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - name: Install dependencies
        run: uv sync --extra dev
      - name: Ruff lint (security rules)
        run: uv run ruff check src/ tests/
      - name: pip-audit (dependency vulnerabilities)
        run: uv run pip-audit
      - name: Check for hardcoded secrets (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  lint:
    name: Lint + Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - name: Install dependencies
        run: uv sync --extra dev
      - name: Ruff format check
        run: uv run ruff format --check src/ tests/
      - name: Mypy
        run: uv run mypy src/
