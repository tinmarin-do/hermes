# docker-compose.yml — Stack cloud-mode local (Postgres replica de Cloud SQL)
# Uso: HERMES_MODE=cloud docker compose up -d
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: hermes
      POSTGRES_USER: hermes
      POSTGRES_PASSWORD: hermes_local
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hermes"]
      interval: 5s
      timeout: 5s
      retries: 5

  dashboard:
    build:
      context: .
      dockerfile: src/dashboard/Dockerfile
    environment:
      HERMES_MODE: cloud
      DATABASE_URL: postgresql://hermes:hermes_local@postgres:5432/hermes
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env

volumes:
  postgres_data:
