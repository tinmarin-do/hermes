# docker-compose.local.yml — Stack local-mode (DuckDB + dashboard, sin GCP, sin costos)
# Uso: docker compose -f docker-compose.local.yml up -d
services:
  dashboard:
    build:
      context: .
      dockerfile: src/dashboard/Dockerfile
    environment:
      HERMES_MODE: local
      HERMES_DUCKDB_PATH: /data/hermes.duckdb
    ports:
      - "8080:8080"
    volumes:
      - ./data:/data
