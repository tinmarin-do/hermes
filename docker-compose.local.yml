# docker-compose.local.yml — Stack local-mode (DuckDB + Ollama, sin GCP, sin costos)
# Uso: docker compose -f docker-compose.local.yml up -d
services:
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  ollama-pull:
    image: ollama/ollama:latest
    depends_on:
      - ollama
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: >
      sh -c "
        sleep 3 &&
        ollama pull llama3.2:3b &&
        ollama pull llama3.1:8b
      "

  dashboard:
    build:
      context: .
      dockerfile: src/dashboard/Dockerfile
    environment:
      HERMES_MODE: local
      HERMES_DUCKDB_PATH: /data/hermes.duckdb
      OLLAMA_BASE_URL: http://ollama:11434
    ports:
      - "8080:8080"
    volumes:
      - ./data:/data
    depends_on:
      - ollama

volumes:
  ollama_models:
